# 合併到 main 後自動發布 GitHub Pages
# 首次使用前：Settings → Pages → Source 選擇「GitHub Actions」
name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只保留一個部署，新的部署會等待前一個完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

      # Claude Flow（https://claude-flow-chi.vercel.app/interior/）建置時會抓本 repo 最新的 main，
      # 這一步通知它重新部署，室內設計的更新才會同步上去。
      # Vercel Deploy Hook 網址存在 Secret VERCEL_DEPLOY_HOOK；沒有設定時略過，不影響 GitHub Pages。
      - name: 通知 Claude Flow 重新部署
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "未設定 VERCEL_DEPLOY_HOOK，略過"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "已通知 Claude Flow 重新部署"
